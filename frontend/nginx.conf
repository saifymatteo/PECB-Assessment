server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend container (compose network name: api).
    # No trailing slash on proxy_pass — the /api prefix is preserved for the backend.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Single-page app: unknown routes fall back to index.html (deep links like /tickets/1).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets are content-hashed — cache them hard.
    location ~* \.(js|css|svg|png|jpg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
