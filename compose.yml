# Full-stack deployment: database + API + nginx-hosted UI, with no .NET or Node installed.
# Local development uses compose.db.yml (database only) instead - see README.md. The database
# service is defined there and pulled in below, so the two files can never drift apart and
# both modes reuse the same db container and data volume.
name: supportdesk

include:
  - compose.db.yml

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: supportdesk-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the database host is the service name, not localhost.
      ConnectionStrings__SupportDesk: "Host=db;Port=5432;Database=supportdesk;Username=supportdesk;Password=supportdesk"
    ports:
      - "5000:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: supportdesk-frontend
    depends_on:
      - api
    ports:
      # Serve the UI at http://localhost:4200 - /api is proxied to the api container.
      - "4200:80"
